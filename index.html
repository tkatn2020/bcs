<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>3D 아바타 피팅 스튜디오 · breezm</title>
  <!--
    v3 — 3D 아바타 피팅 스튜디오 (PRD: docs/PRD-avatar-simulator.md)

  -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    html, body { margin: 0; height: 100%; background: #171a20; overflow: hidden; }
    #v3-stage { position: fixed; inset: 0; touch-action: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="v3-stage"></div>
  <script type="module" src="src/v3/app.js"></script>

</html>
