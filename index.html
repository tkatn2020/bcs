<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>다초점 시뮬레이터 · breezm</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/v2/tokens.css?v=13">
  <link rel="stylesheet" href="src/v2/base.css?v=13">
  <link rel="stylesheet" href="src/v2/simulator.css?v=13">
  <link rel="stylesheet" href="src/v2/components.css?v=13">
  <link rel="stylesheet" href="src/v2/advanced.css?v=13">

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="fit-host" id="fit-host">
    <div class="app">
      <header id="topbar" class="topbar"></header>

      <main class="screens" id="screens">
        <section class="screen" data-tab="simulator" data-screen-label="01 Simulator" id="screen-simulator"></section>
        <section class="screen" data-tab="compare"   data-screen-label="02 Compare"   id="screen-compare"></section>
      </main>
    </div>
  </div>

  <style>
    /* The design size is iPad landscape 1280×800. A wrapper scales it to
       fit the actual viewport so the layout looks identical regardless of
       window size. On a real iPad (1194×834) the scale is ~0.93. */
    html, body { background: #0a0e1a; }
    .fit-host {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0a0e1a;
    }
    .app {
      width: 1280px;
      height: 800px;
      flex-shrink: 0;
      transform-origin: center center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.40);
    }
    .screens {
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-mid) var(--ease);
      overflow: hidden;
    }
    .screen.is-active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>

  <script>
    // Scale the fixed 1280×800 app to fit the viewport.
    (function fitToViewport() {
      const app = () => document.querySelector('.app');
      function apply() {
        const el = app(); if (!el) return;
        const sx = window.innerWidth / 1280;
        const sy = window.innerHeight / 800;
        const s = Math.min(sx, sy, 1.2);
        el.style.transform = `scale(${s})`;
      }
      window.addEventListener('resize', apply);
      window.addEventListener('load', apply);
      apply();
      setTimeout(apply, 50);
    })();
  </script>

  <script type="module" src="src/v2/app.js?v=13"></script>
</body>
</html>
