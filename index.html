<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>누진다초점 시뮬레이터 · iPad</title>
  <link rel="stylesheet" href="src/wavefront/styles.css?v=2">
</head>
<body>
  <div class="ipad-app">

    <!-- ── Top bar ─────────────────────────────────────── -->
    <header id="topbar" class="topbar"></header>

    <!-- ── Main content (active tab panel) ─────────────── -->
    <main id="tab-content" class="tab-content">
      <section id="tab-input"     class="tab-panel" data-tab="input"></section>
      <section id="tab-simulator" class="tab-panel" data-tab="simulator"></section>
      <section id="tab-compare"   class="tab-panel" data-tab="compare"></section>
    </main>

    <!-- ── Bottom tab bar ──────────────────────────────── -->
    <nav id="tabbar" class="tabbar"></nav>

    <!-- ── Settings modal (hidden by default) ──────────── -->
    <div id="settings-modal" class="modal-backdrop hidden"></div>

    <!-- ── Orientation guard (portrait → message) ──────── -->
    <div class="orientation-guard">
      <div class="og-card">
        <div class="og-icon">📱➡️🖥️</div>
        <div class="og-title">가로로 돌려주세요</div>
        <div class="og-sub">이 앱은 iPad 가로 화면에 최적화되어 있습니다</div>
      </div>
    </div>

  </div>

  <script type="module" src="src/wavefront/app.js?v=2"></script>
</body>
</html>
